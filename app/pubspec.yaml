name: futbol_fantasy
description: Gestión de partidos de fútbol amateur + liga Fantasy entre amigos.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # `any` deja que pub elija la versión de intl que fija flutter_localizations
  intl: any
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.2
  app_links: ^6.3.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  uuid: ^4.5.1
  # Push (FCM). Se activa solo si la compilación recibe --dart-define=FIREBASE_APP_ID=…
  image_picker: any
  google_mobile_ads: any
  firebase_core: any
  firebase_messaging: any

dev_dependencies:
  flutter_launcher_icons: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Icono de la app (se genera en la compilación: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono/icono.png"
  adaptive_icon_background: "#0E4B3A"
  adaptive_icon_foreground: "assets/icono/icono_primer_plano.png"
  min_sdk_android: 24
