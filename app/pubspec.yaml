name: futbol_fantasy
description: Gestión de partidos de fútbol amateur + liga Fantasy entre amigos.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # `any` deja que pub elija la versión de intl que fija flutter_localizations
  intl: any
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  shared_preferences: ^2.3.2
  app_links: ^6.3.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
