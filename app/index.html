<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Organiza el fútbol con tus amigos: convocatorias, caja, equipos equilibrados y una liga Fantasy con vuestros partidos.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C8102E">

  <!-- Instalable en iPhone/iPad: Safari › Compartir › Añadir a pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pachanga Fantasy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <meta property="og:title" content="Pachanga Fantasy">
  <meta property="og:description" content="Partidos con amigos y liga Fantasy">

  <title>Pachanga Fantasy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #E2162A; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 18px; font-family: system-ui, -apple-system, sans-serif; color: #F4F1E8; }
    #carga img { width: 96px; height: 96px; border-radius: 22px; }
    #carga .barra { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
    #carga .barra::after { content: ""; display: block; width: 40%; height: 100%; background: #F2A229;
                           animation: ir 1.1s ease-in-out infinite; }
    @keyframes ir { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    <div>Pachanga Fantasy</div>
    <div class="barra"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga'); if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
