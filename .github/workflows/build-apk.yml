name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # La clave publicable es pública por diseño (la seguridad la ponen las políticas RLS).
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wyybdsxnmxgfntyrzjmq.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_nbc_WP9tz7KfkMSKioXptg_QQNtjTlu' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma que falten (no toca lib/ ni ficheros existentes)
        run: flutter create . --platforms android --org com.futbolfantasy --project-name futbol_fantasy

      - name: Compilar todas las librerías Android contra la SDK 36 (algunos plugins traen una más antigua)
        run: |
          f=android/build.gradle.kts
          if [ -f "$f" ]; then
            {
              echo 'subprojects {'
              echo '    afterEvaluate {'
              echo '        val androidExt = extensions.findByName("android")'
              echo '        if (androidExt is com.android.build.gradle.LibraryExtension) {'
              echo '            androidExt.compileSdk = 36'
              echo '        }'
              echo '    }'
              echo '}'
              cat "$f"
            } > /tmp/root.gradle.kts && mv /tmp/root.gradle.kts "$f"
          else
            f=android/build.gradle
            { printf 'subprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android") && p.plugins.hasPlugin("com.android.library")) {\n            p.android.compileSdkVersion 36\n        }\n    }\n}\n'; cat "$f"; } > /tmp/root.gradle && mv /tmp/root.gradle "$f"
          fi
          head -12 "$f"

      - name: minSdk 24 y permiso de notificaciones (Firebase Cloud Messaging)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' "$f" && grep -n "minSdk" "$f" || true
          done
          # lintVitalRelease falla con los plugins de Firebase (bug de lint): no es necesario para compilar
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$f" && grep -n -A3 "lint {" "$f" || true
          done
          m=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$m" || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$m"
          grep -n "POST_NOTIFICATIONS" "$m"
          # AdMob: ID de la app (el de prueba de Google mientras no haya cuenta). Sin él la app se cierra al abrir.
          ADMOB_APP_ID="${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}"
          grep -q "gms.ads.APPLICATION_ID" "$m" || sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>|" "$m"
          grep -n "APPLICATION_ID" "$m"

      - run: flutter pub get

      - name: Icono y nombre de la app
        run: |
          dart run flutter_launcher_icons
          sed -i 's|android:label="[^"]*"|android:label="Fútbol Fantasy"|' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Análisis estático (informativo)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Tests
        run: flutter test

      - name: Compilar APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=APP_VERSION=0.1.${{ github.run_number }}
          --dart-define=ADMOB_INTERSTICIAL=${{ vars.ADMOB_INTERSTICIAL || 'ca-app-pub-3940256099942544/1033173712' }}
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY || 'AIzaSyCg5t9gSuzifQ4FbxSqj4s3GmBtTVRK8l8' }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID || '1:449293148719:android:07b08fd9645abc82f55cda' }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID || '449293148719' }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'futbol-fantasy-89815' }}
          --build-name=0.1.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: futbol-fantasy-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Fútbol Fantasy 0.1.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
