name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # La clave publicable es pública por diseño (la seguridad la ponen las políticas RLS).
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wyybdsxnmxgfntyrzjmq.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_nbc_WP9tz7KfkMSKioXptg_QQNtjTlu' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpetas de plataforma que falten (no toca lib/ ni ficheros existentes)
        run: flutter create . --platforms android --org com.futbolfantasy --project-name futbol_fantasy

      - name: Compilar todas las librerías Android contra la SDK 36 (algunos plugins traen una más antigua)
        run: |
          f=android/build.gradle.kts
          if [ -f "$f" ]; then
            {
              echo 'subprojects {'
              echo '    afterEvaluate {'
              echo '        val androidExt = extensions.findByName("android")'
              echo '        if (androidExt is com.android.build.gradle.LibraryExtension) {'
              echo '            androidExt.compileSdk = 36'
              echo '        }'
              echo '    }'
              echo '}'
              cat "$f"
            } > /tmp/root.gradle.kts && mv /tmp/root.gradle.kts "$f"
          else
            f=android/build.gradle
            { printf 'subprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android") && p.plugins.hasPlugin("com.android.library")) {\n            p.android.compileSdkVersion 36\n        }\n    }\n}\n'; cat "$f"; } > /tmp/root.gradle && mv /tmp/root.gradle "$f"
          fi
          head -12 "$f"

      - name: minSdk 24 y permiso de notificaciones (Firebase Cloud Messaging)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' "$f" && grep -n "minSdk" "$f" || true
          done
          # lintVitalRelease falla con los plugins de Firebase (bug de lint): no es necesario para compilar
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$f" && grep -n -A3 "lint {" "$f" || true
          done
          m=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$m" || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$m"
          grep -n "POST_NOTIFICATIONS" "$m"
          # AdMob: ID de la app (el de prueba de Google mientras no haya cuenta). Sin él la app se cierra al abrir.
          ADMOB_APP_ID="${{ vars.ADMOB_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}"
          grep -q "gms.ads.APPLICATION_ID" "$m" || sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>|" "$m"
          grep -n "APPLICATION_ID" "$m"

      - name: Capturador de cierres (muestra el error en pantalla si la app se cae al abrir)
        run: |
          d=android/app/src/main/kotlin/com/futbolfantasy/futbol_fantasy
          mkdir -p "$d" && cp android_extra/App.kt android_extra/CrashActivity.kt android_extra/ProximoWidget.kt "$d/"
          # MainActivity propia (canal para refrescar el widget): sustituye a la generada
          find android/app/src/main -name 'MainActivity.*' -delete
          cp android_extra/MainActivity.kt "$d/"
          cp -r android_extra/res/. android/app/src/main/res/
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name="${applicationName}"|android:name=".App"|' "$m"
          grep -q 'android:name=".App"' "$m" || sed -i 's|<application|<application android:name=".App"|' "$m"
          grep -q CrashActivity "$m" || sed -i 's|</application>|    <activity android:name=".CrashActivity" android:process=":error" android:exported="false"/>\n    </application>|' "$m"
          grep -q ProximoWidget "$m" || sed -i 's|</application>|    <receiver android:name=".ProximoWidget" android:exported="false"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_proximo_info"/></receiver>\n    </application>|' "$m"
          grep -n -E '\.App"|CrashActivity' "$m"
          # Sin encoger con R8 (quitaba la base de datos de WorkManager y la app se cerraba al abrir en Android 17)
          cp android_extra/proguard-rules.pro android/app/proguard-rules.pro
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'isMinifyEnabled' not in s:
              s = s.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false', 1)
          # flutter_local_notifications necesita «desugaring» de Java 8+
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          open(p, 'w').write(s)
          PY
          grep -n -A3 "release {" android/app/build.gradle.kts

      - run: flutter pub get

      - name: Icono y nombre de la app
        run: |
          dart run flutter_launcher_icons
          sed -i 's|android:label="[^"]*"|android:label="Pachanga Fantasy"|' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Clave de depuración fija (las versiones de prueba se instalan encima de la anterior)
        run: mkdir -p ~/.android && cp ../ci/debug.keystore ~/.android/debug.keystore

      - name: Firma de publicación (solo si existe el secreto ANDROID_KEYSTORE_BASE64)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Sin keystore: se firma con la clave de depuración (APK de pruebas)"; exit 0; fi
          echo "$KS_B64" | base64 -d > android/app/subida.jks
          printf 'storeFile=subida.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'signingConfigs {' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
              bloque = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            val kp = Properties().apply { load(FileInputStream(rootProject.file("key.properties"))) }\n'
                  '            storeFile = file(kp["storeFile"] as String)\n'
                  '            storePassword = kp["storePassword"] as String\n'
                  '            keyAlias = kp["keyAlias"] as String\n'
                  '            keyPassword = kp["keyPassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
                  '    buildTypes {')
              s = s.replace('    buildTypes {', bloque, 1)
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w').write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle.kts
          echo "FIRMA_PLAY=1" >> $GITHUB_ENV

      - name: Análisis estático (informativo)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Tests
        run: flutter test

      - name: Compilar APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=APP_VERSION=0.1.${{ github.run_number }}
          --dart-define=ADMOB_INTERSTICIAL=${{ vars.ADMOB_INTERSTICIAL || 'ca-app-pub-3940256099942544/1033173712' }}
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY || 'AIzaSyCg5t9gSuzifQ4FbxSqj4s3GmBtTVRK8l8' }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID || '1:449293148719:android:07b08fd9645abc82f55cda' }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID || '449293148719' }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'futbol-fantasy-89815' }}
          --build-name=0.9.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Compilar App Bundle para Google Play (solo con firma de publicación)
        if: env.FIRMA_PLAY == '1'
        run: >
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=APP_VERSION=0.1.${{ github.run_number }}
          --dart-define=ADMOB_INTERSTICIAL=${{ vars.ADMOB_INTERSTICIAL || 'ca-app-pub-3940256099942544/1033173712' }}
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY || 'AIzaSyCg5t9gSuzifQ4FbxSqj4s3GmBtTVRK8l8' }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID || '1:449293148719:android:07b08fd9645abc82f55cda' }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID || '449293148719' }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'futbol-fantasy-89815' }}
          --build-name=0.9.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Guardar App Bundle como artefacto
        if: env.FIRMA_PLAY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: futbol-fantasy-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: futbol-fantasy-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          name: Pachanga Fantasy 0.9.${{ github.run_number }} · versión de pruebas
          body_path: docs/novedades.md
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          make_latest: true

  web:
    # Versión web (para iPhone/iPad y ordenador). Se publica en GitHub Pages (rama gh-pages).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://wyybdsxnmxgfntyrzjmq.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_nbc_WP9tz7KfkMSKioXptg_QQNtjTlu' }}
      # Con dominio propio (variable WEB_DOMINIO, p. ej. app.midominio.es) la web vive en la raíz; si no, en /futbol-fantasy/
      WEB_DOMINIO: ${{ vars.WEB_DOMINIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Carpetas web que falten (no toca index.html ni manifest.json)
        run: flutter create . --platforms web --org com.futbolfantasy --project-name futbol_fantasy

      - run: flutter pub get

      - name: Iconos web
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_web.yaml

      - name: Compilar web
        run: |
          if [ -n "$WEB_DOMINIO" ]; then BASE=/; else BASE=/futbol-fantasy/; fi
          flutter build web --release --no-web-resources-cdn --base-href "$BASE" \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=APP_VERSION=0.1.${{ github.run_number }} \
            --dart-define=ADSENSE_CLIENT=${{ vars.ADSENSE_CLIENT }} \
            --dart-define=ADSENSE_SLOT_SUPERIOR=${{ vars.ADSENSE_SLOT_SUPERIOR }} \
            --dart-define=ADSENSE_SLOT_LATERAL=${{ vars.ADSENSE_SLOT_LATERAL }}
          cp ../docs/web/privacidad.html build/web/privacidad.html
          if [ -n "$WEB_DOMINIO" ]; then echo "$WEB_DOMINIO" > build/web/CNAME; fi
          # AdSense exige ads.txt en la raíz del dominio
          if [ -n "${{ vars.ADSENSE_CLIENT }}" ]; then
            echo "google.com, $(echo '${{ vars.ADSENSE_CLIENT }}' | sed 's/^ca-//'), DIRECT, f08c47fec0942fa0" > build/web/ads.txt
          fi
          touch build/web/.nojekyll
          ls build/web

      - name: Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Web ${{ github.sha }}
