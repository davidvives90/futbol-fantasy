name: Copia de seguridad diaria

# Cada noche: volcado de la base de datos de Supabase, comprimido y CIFRADO (el repo es público).
# Se guarda como artefacto 30 días. Para restaurar:
#   gpg --decrypt copia.sql.gz.gpg | gunzip | psql "$URL_DESTINO"
# Secretos necesarios: SUPABASE_DB_URL (cadena de conexión, «Session pooler») y BACKUP_PASSPHRASE.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos
        id: s
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then
            echo "::warning::Faltan los secretos SUPABASE_DB_URL y/o BACKUP_PASSPHRASE: no se hace copia."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar pg_dump 17
        if: steps.s.outputs.ok == '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar, comprimir y cifrar
        if: steps.s.outputs.ok == '1'
        env:
          URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          f="pachanga_$(date -u +%Y%m%d_%H%M).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$URL" --no-owner --no-privileges \
              --schema=public --schema=auth --schema=storage \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE" --symmetric --cipher-algo AES256 -o "$f"
          ls -lh "$f"
          echo "ARCHIVO=$f" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.s.outputs.ok == '1'
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 30
