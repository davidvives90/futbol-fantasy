# Netlify: web pública (portada, privacidad, condiciones) en la raíz y la app web en /app/
[[redirects]]
  from = "/privacidad.html"
  to = "/privacidad"
  status = 301

[[redirects]]
  from = "/i/*"
  to = "/i/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Que el navegador no se quede con una versión vieja de la app web
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/version.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
